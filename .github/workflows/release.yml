name: Create Resource Pack Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 'v1.0.0'
      changelog_en:
        description: 'Changelog in English'
        required: false
        default: '- Add Japanese Translation'
      changelog_jp:
        description: 'Changelog in Japanese'
        required: false
        default: '- 日本語翻訳を追加'

env:
  PROJECT_NAME: 'JP_LOCALIZATION_PROJECT_MMO'
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          zip -r "${PROJECT_NAME}-${RELEASE_VERSION}.zip" . -x "*.git*" "*.github*"

      - name: Generate Release Notes
        env:
          CHANGELOG_EN: ${{ inputs.changelog_en }}
          CHANGELOG_JP: ${{ inputs.changelog_jp }}
        run: |
          {
            printf '%s\n\n' "${RELEASE_VERSION} is here!"
            printf '%s\n' '## Changelog'
            printf '%s\n' "$CHANGELOG_EN" | sed 's/\\n/\n/g'
            printf '\n%s\n\n' '-----'
            printf '%s\n\n' "${RELEASE_VERSION} が登場！"
            printf '%s\n' '## 変更履歴'
            printf '%s\n' "$CHANGELOG_JP" | sed 's/\\n/\n/g'
          } > release_body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body_path: release_body.txt
          files: ${{ env.PROJECT_NAME }}-${{ inputs.version }}.zip
